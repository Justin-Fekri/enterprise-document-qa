[project]
name = "enterprise-doc-qa"
version = "0.1.0"
description = "RAG assistant for enterprise PDF and Word documents, with page-level citations, evidence-based abstention and role-based access control."
requires-python = ">=3.11"

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
